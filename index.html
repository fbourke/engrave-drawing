<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>engrave</title>
<!--
  engrave - photo to pen-plottable stipple + hatch line art.
  Copyright (c) 2026 Forrest Bourke. MIT.
  https://github.com/fbourke/engrave-drawing

  The interface is modelled on, and reuses code from, contour-drawing by TLausZ
  (MIT, Copyright (c) 2026 TLausZ) - https://github.com/TLausZ/contour-drawing
  Reused: the mask panel and its line clipper, this palette and layout, the
  slider/help-popover pattern, the split divider, the paper sizes, and building
  the worker from a Blob of two inline scripts so this runs from file:// too.
  Full notices in LICENSE.
-->
<style>
  :root {
    --paper: #fcfbf8;
    --paper-bright: #fffcf3;
    --ink: #2f0093;
    --ink-soft: #6b5a42;
    --ink-faint: #8a7a5e;
    --line: rgba(85, 0, 255, 0.68);
    --border: rgba(166, 0, 255, 0.25);
    --border-strong: rgba(255, 157, 0, 0.4);
    --accent: rgba(150,90,50,0.95);
    --new-color: #f2ead6;

    /* the drawing itself. the canvas renderer reads these two at paint time, so
       this block is the only place any colour is defined. downloaded svgs are
       always black on transparent, whatever the screen shows. */
    --draw-paper: #fffcf3;
    --draw-ink: rgba(37,0,87,0.95);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size: 13px;
    line-height: 1.4;
    background: var(--paper);
    color: var(--ink-faint);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    height: 61px;
    flex: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 0 16px;
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 15px; font-weight: 600; color: var(--ink); flex: none; }
  header .sub { font-size: 12px; color: var(--ink-faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  main { flex: 1; display: flex; min-height: 0; }
  #stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    margin-right: 276px;
    transition: margin-right .2s, margin-left .2s;
    min-width: 0;
    overflow: hidden;
  }
  #stage.wide { margin-right: 0; }
  #stage.mleft { margin-left: 276px; }
  #wrapper { position: relative; display: inline-block; }
  #view {
    display: block;
    border: 1px solid var(--border);
    background: var(--paper);
    cursor: crosshair;
    touch-action: none;
  }
  #view:not(.ready) { visibility: hidden; }
  #orig {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  #orig:not(.ready) { display: none; }
  #angleSvg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    overflow: visible;
  }
  #angleSvg .g { stroke: rgba(150,90,50,0.4); stroke-width: 1; }
  #angleSvg .g0 { stroke: rgba(150,90,50,0.95); stroke-width: 1.5; }
  #divider {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 14px;
    margin-left: -7px;
    cursor: ew-resize;
    touch-action: none;
  }
  #divider::before {
    content: '';
    position: absolute;
    left: 6px;
    top: 0;
    bottom: 0;
    width: 2px;
    background: var(--ink);
  }
  #divider::after {
    content: '';
    position: absolute;
    left: 1px;
    top: 50%;
    margin-top: -12px;
    width: 12px;
    height: 24px;
    border-radius: 4px;
    background: var(--ink);
  }
  #panel {
    position: fixed;
    top: 61px;
    right: 0;
    bottom: 0;
    width: 276px;
    background: var(--paper);
    border-left: 1px solid var(--border);
    padding: 12px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    transition: transform .2s;
  }
  #panel.hidden { transform: translateX(277px); }
  #ptoggle {
    position: fixed;
    top: 73px;
    right: 276px;
    z-index: 3;
    width: 29px;
    height: 29px;
    flex: none;
    border: 1px solid var(--border-strong);
    border-radius: 4px;
    background: var(--paper);
    color: var(--ink);
    cursor: pointer;
    font-size: 15px;
    line-height: 27px;
    padding: 0;
    transition: right .2s;
  }
  #ptoggle.hidden { right: 8px; }
  #maskPanel {
    position: fixed;
    top: 61px;
    left: 0;
    bottom: 0;
    width: 276px;
    background: var(--paper);
    border-right: 1px solid var(--border);
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    transition: transform .2s;
    z-index: 2;
  }
  #maskPanel.hidden { transform: translateX(-277px); }
  #maskPanel > button, #panel > button { flex: none; }
  #mtoggle {
    position: fixed;
    top: 73px;
    left: 276px;
    z-index: 3;
    width: 29px;
    height: 29px;
    flex: none;
    border: 1px solid var(--border-strong);
    border-radius: 4px;
    background: var(--paper);
    color: var(--ink);
    cursor: pointer;
    font-size: 15px;
    line-height: 27px;
    padding: 0;
    transition: left .2s;
  }
  #mtoggle.hidden { left: 8px; }
  #maskSvg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    overflow: visible;
  }
  #maskSvg .mshape { fill: rgba(150,90,50,0.08); stroke: rgba(150,90,50,0.95); stroke-width: 1.5; }
  #maskSvg .mline { stroke: rgba(150,90,50,0.95); stroke-width: 1; fill: none; }
  #maskSvg .mhandle { fill: rgba(150,90,50,0.95); stroke: var(--paper-bright); stroke-width: 1; }
  #wrapper.maskedit #maskSvg [data-role] { pointer-events: auto; }
  #wrapper.maskedit #maskSvg [data-role="body"] { cursor: move; }
  #wrapper.maskedit #maskSvg .mhandle { cursor: pointer; }
  .btnrow { display: flex; gap: 8px; }
  button {
    font-family: inherit;
    font-size: 12px;
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--border-strong);
    border-radius: 4px;
    padding: 6px 12px;
    cursor: pointer;
    flex: 1;
  }
  button.active { background: var(--ink); color: var(--paper-bright); }
  #controls { display: flex; flex-direction: column; gap: 7px; }
  #controls hr { margin-top: 5px; }
  .cap { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint); }
  .ctrl label {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 2px;
  }
  .ctrl .val { color: var(--ink); }
  .ctrl input[type=range] {
    width: 100%;
    accent-color: var(--ink);
    height: 16px;
  }
  .hint { font-size: 12px; color: var(--ink-faint); }
  select {
    font-family: inherit;
    font-size: 12px;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--border-strong);
    border-radius: 4px;
    padding: 6px 8px;
    width: 100%;
  }
  .help {
    display: inline-block;
    width: 13px;
    height: 13px;
    line-height: 12px;
    text-align: center;
    border: 1px solid var(--border-strong);
    border-radius: 50%;
    font-size: 10px;
    color: var(--ink-faint);
    cursor: help;
    margin-left: 4px;
  }
  #helpPop {
    margin: 0;
    background: var(--paper);
    border: 1px solid var(--border-strong);
    border-radius: 4px;
    padding: 12px;
    max-width: 260px;
    font-size: 12px;
    line-height: 1.4;
    color: var(--ink-soft);
  }
  #helpTitle { color: var(--ink); font-weight: 600; margin-bottom: 4px; }
  .hint b { font-weight: 600; }
  hr { border: none; border-top: 1px solid var(--border); }
  #status { font-size: 12px; color: var(--ink-faint); min-height: 17px; }
  #cli {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px;
    line-height: 1.45;
    color: var(--ink);
    background: var(--paper-bright);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px;
    word-break: break-all;
    user-select: all;
    -webkit-user-select: all;
  }
  #btnCopy { flex: none; align-self: flex-start; }
  /* below 720px the fixed side panels become full-width overlays */
  @media (max-width: 720px) {
    #panel, #maskPanel { width: 100%; z-index: 4; }
    #panel { padding-right: 46px; }
    #maskPanel { padding-left: 46px; }
    #panel.hidden { transform: translateX(101%); }
    #maskPanel.hidden { transform: translateX(-101%); }
    #stage, #stage.wide, #stage.mleft { margin-right: 0; margin-left: 0; }
    #ptoggle, #ptoggle.hidden { right: 8px; z-index: 5; }
    #mtoggle, #mtoggle.hidden { left: 8px; z-index: 5; }
  }
</style>
</head>
<body>
<header>
  <h1>engrave</h1>
  <div class="sub" id="imginfo"></div>
</header>
<main>
  <div id="stage">
    <div id="wrapper">
      <canvas id="view"></canvas>
      <canvas id="orig"></canvas>
      <svg id="angleSvg"></svg>
      <div id="divider"></div>
      <svg id="maskSvg"></svg>
    </div>
  </div>
  <div id="panel">
    <div class="btnrow">
      <button id="btnLoad">load image</button>
      <button id="btnExample">example</button>
    </div>
    <input type="file" id="fileInput" accept="image/*" hidden>

    <div id="controls"></div>
    <button id="btnReset">reset values</button>

    <hr>
    <div class="cap">view</div>
    <div class="ctrl">
      <label><span>left of divider<span class="help" id="helpLeft">?</span></span></label>
      <select id="leftSel">
        <option value="tone" selected>tone map</option>
        <option value="flow">flow</option>
      </select>
    </div>
    <div class="hint" id="dragHint">drag on the image to set the hatch angle &middot; it only shows where the image has no direction of its own</div>

    <hr>
    <div class="cap">export</div>
    <div class="ctrl">
      <label>paper</label>
      <select id="paperSel">
        <option value="" selected>none (drawing size)</option>
        <option value="841,1189" data-slug="A0">A0</option>
        <option value="594,841" data-slug="A1">A1</option>
        <option value="420,594" data-slug="A2">A2</option>
        <option value="297,420" data-slug="A3">A3</option>
        <option value="210,297" data-slug="A4">A4</option>
        <option value="148,210" data-slug="A5">A5</option>
        <option value="863.6,1117.6" data-slug="ANSI-E">ANSI E (34 x 44 in)</option>
        <option value="558.8,863.6" data-slug="ANSI-D">ANSI D (22 x 34 in)</option>
        <option value="431.8,558.8" data-slug="ANSI-C">ANSI C (17 x 22 in)</option>
        <option value="279.4,431.8" data-slug="Tabloid">Tabloid (11 x 17 in)</option>
        <option value="215.9,355.6" data-slug="Legal">Legal (8.5 x 14 in)</option>
        <option value="215.9,279.4" data-slug="Letter">Letter (8.5 x 11 in)</option>
        <option value="139.7,215.9" data-slug="Half-Letter">Half Letter (5.5 x 8.5 in)</option>
      </select>
    </div>
    <button id="btnDlSvg">download svg</button>
    <div class="ctrl">
      <label><span>simplify for studio<span class="help" id="helpSimp">?</span></span></label>
      <select id="dxfSel">
        <option value="" selected>off — every mark</option>
        <option value="light">light — 20,000 marks</option>
        <option value="medium">medium — 10,000 marks</option>
        <option value="heavy">heavy — 5,000 marks</option>
      </select>
    </div>
    <div class="hint" id="dxfEst"></div>
    <button id="btnDlDxf">download dxf</button>

    <hr>
    <div class="cap">command<span class="help" id="helpCli">?</span></div>
    <div id="cli"></div>
    <button id="btnCopy">copy</button>
    <div id="status"></div>
  </div>
</main>

<button id="ptoggle" title="show/hide menu">&rsaquo;</button>

<div id="maskPanel" class="hidden">
  <div class="btnrow">
    <button id="mEllipse">ellipse</button>
    <button id="mRect">rect</button>
    <button id="mLasso">lasso</button>
  </div>
  <button id="mInvert">invert</button>
  <button id="mClear">remove mask</button>
  <div class="hint" id="mHint">pick a shape to clip the lines</div>
</div>
<button id="mtoggle" class="hidden" title="show/hide mask tools">&rsaquo;</button>

<div id="helpPop" popover>
  <div id="helpTitle"></div>
  <div id="helpText"></div>
</div>

<script id="sharedSrc">
// core — image maths shared by the page and the worker.
// plain script scope: no imports, no exports, no DOM.

// ----------------------------------------------------------------- gaussian

// scipy kernel: normalise the gaussian first, then apply the derivative
// polynomial, so the order-1 kernel sums to ~0 rather than 1.
// scipy correlates with an already-reversed kernel, so order 1 nets out to +d/dx.
function gaussKernel(sigma, order) {          // truncate fixed at 4.0
  const r = Math.floor(4.0 * sigma + 0.5), n = 2 * r + 1, s2 = sigma * sigma;
  const phi = new Float64Array(n);
  let sum = 0;
  for (let j = 0; j < n; j++) { const x = j - r; phi[j] = Math.exp(-0.5 / s2 * x * x); sum += phi[j]; }
  for (let j = 0; j < n; j++) phi[j] /= sum;
  if (order === 0) return { r: r, K: phi };
  const K = new Float64Array(n);
  for (let j = 0; j < n; j++) K[j] = ((j - r) / s2) * phi[j];
  return { r: r, K: K };
}

// scipy's default boundary: half-sample symmetric, (d c b a | a b c d | d c b a)
function reflectIdx(i, n) {
  if (n === 1) return 0;
  const p = 2 * n;
  i = i % p; if (i < 0) i += p;
  return i < n ? i : p - 1 - i;
}

// one 1-D correlation pass; accumulates in float64, writes float32 like scipy
function gaussPass(src, dst, w, h, K, r, axis) {
  const n = 2 * r + 1;
  if (axis === 0) {                            // along y
    const acc = new Float64Array(w);
    for (let y = 0; y < h; y++) {
      acc.fill(0);
      for (let j = 0; j < n; j++) {
        const row = reflectIdx(y + j - r, h) * w, kj = K[j];
        for (let x = 0; x < w; x++) acc[x] += kj * src[row + x];
      }
      const o = y * w;
      for (let x = 0; x < w; x++) dst[o + x] = acc[x];
    }
  } else {                                     // along x
    for (let y = 0; y < h; y++) {
      const o = y * w;
      for (let x = 0; x < w; x++) {
        let s = 0;
        if (x >= r && x + r < w) {
          const b = o + x - r;
          for (let j = 0; j < n; j++) s += K[j] * src[b + j];
        } else {
          for (let j = 0; j < n; j++) s += K[j] * src[o + reflectIdx(x + j - r, w)];
        }
        dst[o + x] = s;
      }
    }
  }
}

// separable gaussian_filter: axis 0 (y) first, then axis 1 (x),
// with the intermediate rounded to float32 — both are bit-significant.
function gaussFilter(src, w, h, sigma, order0, order1) {
  const n = w * h;
  if (!(sigma > 1e-15)) { const c = new Float32Array(n); c.set(src); return c; }
  const k0 = gaussKernel(sigma, order0), k1 = gaussKernel(sigma, order1);
  const tmp = new Float32Array(n), out = new Float32Array(n);
  gaussPass(src, tmp, w, h, k0.K, k0.r, 0);
  gaussPass(tmp, out, w, h, k1.K, k1.r, 1);
  return out;
}

function gaussianBlur(src, w, h, sigma) {
  return gaussFilter(src, w, h, sigma, 0, 0);
}

// axis 0 = y (order (1,0)), axis 1 = x (order (0,1)); both positive on a rising ramp
function gaussianDeriv(src, w, h, sigma, axis) {
  return axis === 0 ? gaussFilter(src, w, h, sigma, 1, 0)
                    : gaussFilter(src, w, h, sigma, 0, 1);
}

// ----------------------------------------------------------------- sampling

// map_coordinates(order=1, mode='nearest'): clamp first, y weight multiplies first
function sampleBilinear(arr, w, h, x, y) {
  const xmax = w - 1, ymax = h - 1;
  let cx = x < 0 ? 0 : (x > xmax ? xmax : x);
  let cy = y < 0 ? 0 : (y > ymax ? ymax : y);
  const x0 = cx | 0, y0 = cy | 0;
  const x1 = x0 < xmax ? x0 + 1 : x0, y1 = y0 < ymax ? y0 + 1 : y0;
  const fx = cx - x0, fy = cy - y0;
  const r0 = y0 * w, r1 = y1 * w;
  return arr[r0 + x0] * (1 - fy) * (1 - fx) + arr[r0 + x1] * (1 - fy) * fx
       + arr[r1 + x0] * fy * (1 - fx) + arr[r1 + x1] * fy * fx;
}

// ----------------------------------------------------------------- tone

// load_tone() minus the file loading: gray in [0,1] -> darkness in [0,1]
function toneMap(gray, w, h, o) {
  const n = w * h, contrast = o.contrast, gamma = o.gamma, invert = !!o.invert;
  const wp = o.whitePoint > 0 ? o.whitePoint : 0, wden = Math.max(1e-6, 1 - wp);
  const t = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const a = invert ? 1 - gray[i] : gray[i];
    let v = (1 - a - 0.5) * contrast + 0.5;
    v = v < 0 ? 0 : (v > 1 ? 1 : v);
    v = Math.pow(v, gamma);
    // white point: below it is bare paper, and zero tone means no ink at all.
    // the rest is rescaled so the tonal range still spans 0..1.
    if (wp > 0) { v = (v - wp) / wden; v = v < 0 ? 0 : (v > 1 ? 1 : v); }
    t[i] = v;
  }
  return t;
}

// ----------------------------------------------------------------- flow

// edge_tangent_flow(): structure tensor -> minor eigenvector (isophote tangent).
// smoothing the tensor rather than the angle handles the theta == theta+pi wrap.
function edgeTangentFlow(tone, w, h, o) {
  const n = w * h;
  const passes = o.passes == null ? 3 : o.passes | 0;
  const gx = gaussianDeriv(tone, w, h, 1.0, 1);
  const gy = gaussianDeriv(tone, w, h, 1.0, 0);
  let E = new Float32Array(n), F = new Float32Array(n), G = new Float32Array(n);
  for (let i = 0; i < n; i++) { const a = gx[i], b = gy[i]; E[i] = a * a; F[i] = a * b; G[i] = b * b; }
  for (let p = 0; p < passes; p++) {           // float32 between passes, like numpy
    E = gaussianBlur(E, w, h, o.flowBlur);
    F = gaussianBlur(F, w, h, o.flowBlur);
    G = gaussianBlur(G, w, h, o.flowBlur);
  }
  // fround at each step: numpy keeps this arithmetic in float32
  const fr = Math.fround;
  const tx = new Float32Array(n), ty = new Float32Array(n), coh = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const e = E[i], f = F[i], g = G[i], d = fr(e - g);
    const th = fr(0.5 * fr(Math.atan2(fr(2 * f), d)));   // major axis; rotate 90deg -> tangent
    tx[i] = -Math.sin(th); ty[i] = Math.cos(th);
    const lam = fr(Math.sqrt(Math.max(fr(fr(d * d) + fr(4 * fr(f * f))), 0)));
    coh[i] = lam / fr(fr(e + g) + 1e-12);      // anisotropy: 0 where tone is locally flat
  }
  // flat regions have no direction of their own: blend toward a fixed angle.
  // cohFloor <= 0 (or absent) skips the blend and returns the raw field.
  const floor = o.cohFloor;
  if (floor > 0) {
    const a = (o.flatAngle || 0) * Math.PI / 180, fx = Math.cos(a), fy = Math.sin(a);
    for (let i = 0; i < n; i++) {
      let k = coh[i] / (floor + 1e-9);
      k = k < 0 ? 0 : (k > 1 ? 1 : k);
      const bx = fr(k * tx[i] + (1 - k) * fx), by = fr(k * ty[i] + (1 - k) * fy);
      const nrm = fr(fr(Math.hypot(bx, by)) + 1e-9);
      tx[i] = bx / nrm; ty[i] = by / nrm;
    }
  }
  return { tx: tx, ty: ty, coh: coh };
}

// ----------------------------------------------------------------- lic

// deterministic white noise from the pixel index (murmur3 finaliser)
function hashNoise01(i) {
  let x = (i + 0x9e3779b9) | 0;
  x = Math.imul(x ^ (x >>> 16), 0x85ebca6b);
  x = Math.imul(x ^ (x >>> 13), 0xc2b2ae35);
  x = (x ^ (x >>> 16)) >>> 0;
  return x / 4294967296;
}

// line integral convolution: average noise along the streamline through each
// pixel, so the tangent field shows up as smeared filaments.
function licPreview(tx, ty, w, h, o) {
  o = o || {};
  const steps = o.steps == null ? 12 : o.steps | 0;
  const stepLen = o.stepLen == null ? 1.0 : o.stepLen;
  const n = w * h, xmax = w - 1, ymax = h - 1;
  const noise = new Float32Array(n);
  for (let i = 0; i < n; i++) noise[i] = hashNoise01(i);
  const out = new Float32Array(n);
  for (let py = 0; py < h; py++) {
    for (let px = 0; px < w; px++) {
      let acc = noise[py * w + px], cnt = 1;
      for (let dir = 0; dir < 2; dir++) {
        let x = px, y = py, pdx = 0, pdy = 0;
        for (let s = 0; s < steps; s++) {
          const x0 = x | 0, y0 = y | 0;        // x,y stay in range: checked below
          const x1 = x0 < xmax ? x0 + 1 : x0, y1 = y0 < ymax ? y0 + 1 : y0;
          const fx = x - x0, fy = y - y0;
          const r0 = y0 * w, r1 = y1 * w;
          const w00 = (1 - fy) * (1 - fx), w01 = (1 - fy) * fx;
          const w10 = fy * (1 - fx), w11 = fy * fx;
          let dx = tx[r0 + x0] * w00 + tx[r0 + x1] * w01 + tx[r1 + x0] * w10 + tx[r1 + x1] * w11;
          let dy = ty[r0 + x0] * w00 + ty[r0 + x1] * w01 + ty[r1 + x0] * w10 + ty[r1 + x1] * w11;
          if (s === 0) { if (dir === 1) { dx = -dx; dy = -dy; } }
          else if (dx * pdx + dy * pdy < 0) { dx = -dx; dy = -dy; }
          pdx = dx; pdy = dy;
          x += dx * stepLen; y += dy * stepLen;
          if (x < 0 || x > xmax || y < 0 || y > ymax) break;
          acc += noise[(y | 0) * w + (x | 0)]; cnt++;
        }
      }
      out[py * w + px] = acc / cnt;
    }
  }
  licStretch(out, n);
  return out;
}

// contrast stretch to the 1st..99th percentile, via a histogram
function licStretch(a, n) {
  let lo = Infinity, hi = -Infinity;
  for (let i = 0; i < n; i++) { const v = a[i]; if (v < lo) lo = v; if (v > hi) hi = v; }
  if (!(hi > lo)) { a.fill(0.5); return; }
  const NB = 4096, hist = new Int32Array(NB), sc = NB / (hi - lo);
  for (let i = 0; i < n; i++) {
    let b = (a[i] - lo) * sc | 0; if (b >= NB) b = NB - 1;
    hist[b]++;
  }
  const c1 = n * 0.01, c99 = n * 0.99;
  let cum = 0, b1 = 0, b99 = NB - 1;
  for (let b = 0; b < NB; b++) {
    const prev = cum; cum += hist[b];
    if (prev < c1 && cum >= c1) b1 = b;
    if (prev < c99 && cum >= c99) { b99 = b; break; }
  }
  const p1 = lo + b1 / sc, p99 = lo + (b99 + 1) / sc, d = p99 - p1;
  if (!(d > 0)) { a.fill(0.5); return; }
  for (let i = 0; i < n; i++) {
    const v = (a[i] - p1) / d;
    a[i] = v < 0 ? 0 : (v > 1 ? 1 : v);
  }
}

<script id="workerSrc" type="text/plain">
// worker half: seeding, tracing, and the run() pipeline.
// core (gaussianBlur, gaussianDeriv, sampleBilinear, toneMap, edgeTangentFlow,
// licPreview) is concatenated ahead of this file, so it is already in scope.

// ----------------------------------------------------------------- seeding

// engrave.py coverage_radius(): a stroke lays L*pen of ink, so r = sqrt(packing*L*pen/A).
function coverageRadius(tone, w, h, Lpx, penPx, maxCov, rMin, rMax, packing) {
  if (packing === undefined) packing = 0.75;
  const n = w * h, out = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    // np.clip semantics: upper bound wins when the bounds cross
    let A = tone[i];
    if (A < 1e-3) A = 1e-3;
    if (A > maxCov) A = maxCov;
    const L = Lpx[i] > penPx ? Lpx[i] : penPx;
    let r = Math.sqrt(packing * L * penPx / A);
    if (r < rMin) r = rMin;
    if (r > rMax) r = rMax;
    out[i] = r;
  }
  return out;
}

// mulberry32. numpy's PCG64 is not reproduced, so the stroke field is
// statistically equivalent to the CLI but not point-identical.
function makeRng(seed) {
  let a = (seed | 0) >>> 0;
  return function () {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// engrave.py poisson_seeds(): variable-radius dart throwing against `rad`.
// grid cell = rLight, up to 4 stored points per cell, neighbour reach 2 cells.
function poissonSeeds(tone, w, h, rad, rLight, rng, oversample, maxSeeds, onProgress) {
  const H = h, W = w;
  let rDark = Infinity;
  for (let i = 0, n = W * H; i < n; i++) if (rad[i] < rDark) rDark = rad[i];
  const cell = rLight;
  const gh = Math.floor(H / cell) + 2, gw = Math.floor(W / cell) + 2;
  const grid = new Int32Array(gh * gw * 4).fill(-1);
  const gcount = new Int8Array(gh * gw);

  const rd = rDark > 0.5 ? rDark : 0.5;
  let nCand = Math.floor(oversample * H * W / (Math.PI * rd * rd));
  if (nCand > 3000000) nCand = 3000000;

  const cap = Math.min(maxSeeds, nCand) + 1;
  const px = new Float32Array(cap), py = new Float32Array(cap);
  let n = 0, truncated = false;

  const tick = Math.max(1, Math.floor(nCand / 50));
  for (let i = 0; i < nCand; i++) {
    if (onProgress && i % tick === 0) onProgress(i / nCand);
    const y = rng() * (H - 1), x = rng() * (W - 1);
    const iy = y | 0, ix = x | 0;
    // early tone rejection: skip candidates in near-white areas probabilistically.
    // tone 0 is paper white and gets nothing at all - without that hard floor the
    // +0.02 would keep sprinkling dots across an empty sky.
    const tv = tone[iy * W + ix];
    if (tv <= 0) continue;
    let keep = tv * 1.6 + 0.02;
    if (keep > 1) keep = 1; else if (keep < 0) keep = 0;
    if (rng() >= keep) continue;

    const r = rad[iy * W + ix], r2 = r * r;
    const gy0 = Math.floor(y / cell), gx0 = Math.floor(x / cell);
    let ok = true;
    for (let ddy = -2; ddy <= 2 && ok; ddy++) {
      const yy = gy0 + ddy;
      if (yy < 0 || yy >= gh) continue;
      for (let ddx = -2; ddx <= 2 && ok; ddx++) {
        const xx = gx0 + ddx;
        if (xx < 0 || xx >= gw) continue;
        const c = gcount[yy * gw + xx], base = (yy * gw + xx) * 4;
        for (let k = 0; k < c; k++) {
          const j = grid[base + k], dx = px[j] - x, dy = py[j] - y;
          if (dx * dx + dy * dy < r2) { ok = false; break; }
        }
      }
    }
    if (!ok) continue;

    px[n] = x; py[n] = y;
    const gi = gy0 * gw + gx0;
    if (gcount[gi] < 4) { grid[gi * 4 + gcount[gi]] = n; gcount[gi]++; }
    n++;
    if (n >= maxSeeds) { truncated = true; break; }
  }
  if (onProgress) onProgress(1);
  return { sx: px.subarray(0, n), sy: py.subarray(0, n), n: n, truncated: truncated };
}

// ----------------------------------------------------------------- tracing

// engrave.py trace() + the stroke assembly in run(), one seed at a time.
// Per-seed early stop is geometrically identical to the lockstep version:
// frozen seeds only ever append zero-length segments.
function traceStrokes(sx, sy, n, tx, ty, tone, w, h, opts) {
  const stepLen = opts.stepLen, minTone = opts.minTone, dotr = opts.dotSize;
  const half = opts.halfLen, maxSteps = opts.steps | 0;
  const wantDots = opts.dots !== false;   // cross-hatch passes drop dots entirely
  const xhi = w - 1, yhi = h - 1;
  const fx = new Float64Array(maxSteps), fy = new Float64Array(maxSteps);
  const bx = new Float64Array(maxSteps), by = new Float64Array(maxSteps);
  const onProgress = opts.onProgress;
  const tick = Math.max(1, Math.floor(n / 50));

  // walk one direction; returns how many points past the seed were produced
  function walk(x, y, sign, k, ox, oy) {
    let pdx = 0, pdy = 0, m = 0;
    for (let s = 0; s < k; s++) {
      let dx = sampleBilinear(tx, w, h, x, y), dy = sampleBilinear(ty, w, h, x, y);
      if (s === 0) { dx *= sign; dy *= sign; }
      else if (dx * pdx + dy * pdy < 0) { dx = -dx; dy = -dy; }
      // RK2 midpoint, sign-aligned against the first sample
      const mx = x + dx * stepLen * 0.5, my = y + dy * stepLen * 0.5;
      let dx2 = sampleBilinear(tx, w, h, mx, my), dy2 = sampleBilinear(ty, w, h, mx, my);
      if (dx2 * dx + dy2 * dy < 0) { dx2 = -dx2; dy2 = -dy2; }
      const nx = x + dx2 * stepLen, ny = y + dy2 * stepLen;
      pdx = dx2; pdy = dy2;
      if (!(nx >= 0 && nx < xhi && ny >= 0 && ny < yhi)) break;
      const cx = nx < 0 ? 0 : (nx > xhi ? xhi : nx), cy = ny < 0 ? 0 : (ny > yhi ? yhi : ny);
      if (!(sampleBilinear(tone, w, h, cx, cy) > minTone)) break;
      x = nx; y = ny;
      ox[m] = x; oy[m] = y; m++;
    }
    return m;
  }

  const strokes = [];           // may be shorter than n when dots are dropped
  let nDots = 0;
  for (let i = 0; i < n; i++) {
    if (onProgress && i % tick === 0) onProgress(i / n);
    const x0 = sx[i], y0 = sy[i];
    const k = Math.round(half[i]);
    if (k < 1) {
      if (wantDots) { strokes.push(new Float32Array([x0 - dotr, y0, x0 + dotr, y0])); nDots++; }
      continue;
    }
    const kf = walk(x0, y0, 1, k, fx, fy);
    const kb = walk(x0, y0, -1, k, bx, by);
    const p = new Float32Array((kb + 1 + kf) * 2);
    let o = 0;
    for (let j = kb - 1; j >= 0; j--) { p[o++] = bx[j]; p[o++] = by[j]; }
    p[o++] = x0; p[o++] = y0;
    for (let j = 0; j < kf; j++) { p[o++] = fx[j]; p[o++] = fy[j]; }
    // too short to read as a line -> stipple
    let d = 0;
    for (let j = 2; j < p.length; j += 2) d += Math.hypot(p[j] - p[j - 2], p[j + 1] - p[j - 1]);
    if (d < dotr) {
      if (wantDots) { strokes.push(new Float32Array([x0 - dotr, y0, x0 + dotr, y0])); nDots++; }
    } else {
      strokes.push(p);
    }
  }
  if (onProgress) onProgress(1);
  return { strokes: strokes, nDots: nDots };
}

// ----------------------------------------------------------------- pipeline

// engrave.py layer(): one seeding + tracing pass over a tone field. Called once
// for the flow-following base and again, rotated, for the cross-hatch.
function layerPass(tone, w, h, tx, ty, P, penPx, rMin, rMax, rng, maxSeeds, post, dots) {
  const db = P.dotBelow, den = Math.max(1e-6, 1 - db), npx = w * h;
  const Lpx = new Float32Array(npx);
  for (let i = 0; i < npx; i++) {
    let tl = (tone[i] - db) / den;
    if (tl < 0) tl = 0; else if (tl > 1) tl = 1;
    Lpx[i] = Math.pow(tl, P.lenGamma) * P.maxSteps * P.step * 2.0;
  }
  const rad = coverageRadius(tone, w, h, Lpx, penPx, P.maxCoverage, rMin, rMax, 0.75);
  const seeds = poissonSeeds(tone, w, h, rad, rMax, rng, P.oversample > 0 ? P.oversample : 12,
    maxSeeds, function (p) { post({ type: 'progress', stage: 'seed', p: p }); });

  const n = seeds.n, half = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    // sampled with integer truncation, like numpy's .astype(int)
    const L = Lpx[(seeds.sy[i] | 0) * w + (seeds.sx[i] | 0)];
    let v = L / (2.0 * P.step);
    if (v < 0) v = 0; else if (v > P.maxSteps) v = P.maxSteps;
    half[i] = v;
  }

  const tr = traceStrokes(seeds.sx, seeds.sy, n, tx, ty, tone, w, h, {
    steps: P.maxSteps, stepLen: P.step, minTone: P.minTone, halfLen: half,
    dotSize: P.dotSize, dots: dots,
    onProgress: function (p) { post({ type: 'progress', stage: 'trace', p: p }); }
  });
  return { strokes: tr.strokes, nDots: tr.nDots, seeds: n, truncated: seeds.truncated };
}

// engrave.py run(). post(msg, transfer) is injected so this is testable off-worker.
function engrave(msg, post) {
  const t0 = Date.now();
  const w = msg.w | 0, h = msg.h | 0, P = msg.params;
  const gray = msg.gray instanceof Float32Array ? msg.gray : new Float32Array(msg.gray);

  const tone = toneMap(gray, w, h, {
    contrast: P.contrast, gamma: P.gamma, invert: !!P.invert, whitePoint: P.whitePoint
  });
  post({ type: 'progress', stage: 'tone', p: 1 });

  const flow = edgeTangentFlow(tone, w, h, {
    flowBlur: P.flowBlur, flatAngle: P.flatAngle, cohFloor: P.cohFloor, passes: 3
  });
  post({ type: 'progress', stage: 'flow', p: 1 });
  const lic = msg.wantFlow ? licPreview(flow.tx, flow.ty, w, h, { steps: 12, stepLen: 1.0 }) : null;

  const scale = P.widthMm / w;              // mm per px
  // drawn width is for the pen; packing width is what the spacing maths assumes
  // each stroke inks over. only the second one changes the geometry.
  const penPx = P.penMm / scale;
  const packPx = (P.packMm > 0 ? P.packMm : P.penMm) / scale;
  const npx = w * h;
  const rMax = P.spacing;                   // detail fixed at 1
  const rMin = Math.max(P.minSpacing, packPx * 0.9);
  const maxSeeds = P.maxSeeds > 0 ? P.maxSeeds : 400000;
  const rng = makeRng(P.seed);

  const base = layerPass(tone, w, h, flow.tx, flow.ty, P, packPx, rMin, rMax, rng, maxSeeds, post, true);
  let strokes = base.strokes;
  let nCross = 0;

  // cross-hatch: a second pass at an angle to the flow, over the dark band only.
  // its tone field is zero outside the band so seeding stops at the edge, and it
  // emits no dots, because stipple inside a solid shadow just reads as noise.
  if (P.crossAbove < 1) {
    const ca = P.crossAbove, cden = Math.max(1e-6, 1 - ca);
    const t2 = new Float32Array(npx);
    for (let i = 0; i < npx; i++) {
      let v = (tone[i] - ca) / cden;
      t2[i] = v < 0 ? 0 : (v > 1 ? 1 : v);
    }
    const a2 = P.crossAngle * Math.PI / 180, c2 = Math.cos(a2), s2 = Math.sin(a2);
    const cx = new Float32Array(npx), cy = new Float32Array(npx);
    for (let i = 0; i < npx; i++) {
      cx[i] = flow.tx[i] * c2 - flow.ty[i] * s2;
      cy[i] = flow.tx[i] * s2 + flow.ty[i] * c2;
    }
    const cross = layerPass(t2, w, h, cx, cy, P, packPx, rMin, rMax, rng, maxSeeds, post, false);
    nCross = cross.strokes.length;
    strokes = strokes.concat(cross.strokes);
  }

  // pack: offsets[i]..offsets[i+1] is stroke i's slice of coords, in POINTS
  // (coordinate pairs), so coords index = offsets[i]*2. offsets has n+1 entries.
  const n = strokes.length;
  let total = 0;
  for (let i = 0; i < n; i++) total += strokes[i].length >> 1;
  const coords = new Float32Array(total * 2), offsets = new Uint32Array(n + 1);
  let o = 0;
  for (let i = 0; i < n; i++) {
    offsets[i] = o >> 1;
    coords.set(strokes[i], o);
    o += strokes[i].length;
  }
  offsets[n] = o >> 1;

  const done = {
    type: 'done', w: w, h: h,
    coords: coords.buffer, offsets: offsets.buffer,
    nStrokes: n, nDots: base.nDots,
    tone: tone.buffer, flow: lic ? lic.buffer : null,
    stats: {
      seeds: base.seeds, nDots: base.nDots, nHatch: n - base.nDots, nCross: nCross,
      truncated: base.truncated, ms: Date.now() - t0,
      penPx: penPx, packPx: packPx, maxSeeds: maxSeeds
    }
  };
  const transfer = [coords.buffer, offsets.buffer, tone.buffer];
  if (lic) transfer.push(lic.buffer);
  post(done, transfer);
}

if (typeof self !== 'undefined' && typeof self.postMessage === 'function') {
  self.onmessage = function (e) {
    engrave(e.data, function (m, t) { self.postMessage(m, t || []); });
  };
}

const $ = id => document.getElementById(id);
const fmt = n => n.toLocaleString('en-US');
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

const MAX_SEEDS = 400000;        // hard cap; the worker reports truncated when it is hit

// phones are far slower at this and the stage is small anyway, so they start on a
// smaller working image and with the panel collapsed. the slider still goes to 1400.
const NARROW = window.innerWidth <= 720;
const DRAG_HINT = 'drag on the image to set the hatch angle &middot; it only shows where the image has no direction of its own';

// every control, in panel order; group headings split them into four sections
const CONTROLS = [
  { g: 'tone', key: 'contrast', label: 'contrast', min: 0.5, max: 2.5, step: 0.05, def: 1.15,
    help: 'stretches darkness about the midtone: above 1 deepens shadows and clears highlights' },
  { g: 'tone', key: 'gamma', label: 'gamma', min: 0.3, max: 2.5, step: 0.05, def: 1.0,
    help: 'bends the midtones after the contrast stretch: above 1 lightens them, below 1 darkens them' },
  { g: 'tone', key: 'invert', type: 'toggle', label: 'invert', def: false,
    help: 'treats the image as a negative, so light areas get the ink' },

  { g: 'tone', key: 'whitePoint', label: 'white point', min: 0, max: 0.5, step: 0.01, def: 0,
    help: 'tone below this gets no marks at all, so highlights fall away to bare paper; 0 is off' },

  { g: 'flow', key: 'flowBlur', label: 'flow blur', min: 0.5, max: 16, step: 0.5, def: 4,
    help: 'smoothing of the structure tensor: larger gives a calmer flow that ignores fine texture' },
  { g: 'flow', key: 'flatAngle', label: 'flat angle', min: 0, max: 180, step: 1, def: 25,
    help: 'hatch angle in degrees used where the image has no direction of its own; drag on the image to set it' },
  { g: 'flow', key: 'cohFloor', label: 'coherence floor', min: 0.02, max: 1, step: 0.01, def: 0.35,
    help: 'anisotropy below which the flat angle takes over: higher means more of the image hatches straight' },

  { g: 'marks', key: 'spacing', label: 'spacing', min: 1, max: 8, step: 0.1, def: 3.2,
    help: 'seed spacing in working pixels where the image is lightest: bigger is sparser and faster' },
  { g: 'marks', key: 'minSpacing', label: 'min spacing', min: 0.3, max: 3, step: 0.1, def: 0.8,
    help: 'hard floor on seed spacing, so the darkest areas cannot collapse into solid black' },
  { g: 'marks', key: 'maxCoverage', label: 'max coverage', min: 0.3, max: 1, step: 0.01, def: 0.82,
    help: 'ink coverage at pure black, 1 being a solid fill' },
  { g: 'marks', key: 'maxSteps', label: 'max steps', min: 2, max: 40, step: 1, def: 14,
    help: 'longest stroke, in trace steps per half: caps how far hatching follows the flow' },
  { g: 'marks', key: 'step', label: 'step', min: 0.4, max: 3, step: 0.05, def: 1.1,
    help: 'length of one trace step in pixels: smaller follows curves more closely' },
  { g: 'marks', key: 'lenGamma', label: 'length gamma', min: 0.4, max: 3, step: 0.05, def: 1.3,
    help: 'how fast stroke length grows with darkness: above 1 keeps midtones short and stippled' },
  { g: 'marks', key: 'dotBelow', label: 'dot below', min: 0, max: 0.6, step: 0.01, def: 0.22,
    help: 'darkness below which strokes shrink to dots, turning the hatching into stipple' },
  { g: 'marks', key: 'minTone', label: 'min tone', min: 0, max: 0.3, step: 0.01, def: 0.06,
    help: 'strokes stop as soon as they wander into an area lighter than this' },
  { g: 'marks', key: 'dotSize', label: 'dot size', min: 0.1, max: 1.5, step: 0.05, def: 0.35,
    help: 'length in pixels of the tiny mark that stands in for a dot' },
  { g: 'marks', key: 'crossAbove', label: 'cross above', min: 0.3, max: 1, step: 0.01, def: 1,
    help: 'darkness above which a second cross-hatch layer is laid over the flow; 1 is off' },
  { g: 'marks', key: 'crossAngle', label: 'cross angle', min: 10, max: 90, step: 1, def: 55,
    help: 'angle of the cross-hatch layer relative to the flow it crosses, in degrees' },
  { g: 'marks', key: 'seed', type: 'seed', label: 'seed', def: 0,
    help: 'starting value of the random number generator; reshuffle draws a different seed layout at the same settings' },

  { g: 'output', key: 'penMm', label: 'draw width', min: 0.05, max: 1.2, step: 0.05, def: 0.3,
    help: 'width of the drawn line in mm: the svg stroke width, and nothing else — it never moves a stroke' },
  { g: 'output', key: 'packMm', label: 'packing width', min: 0.05, max: 1.2, step: 0.05, def: 0.3,
    help: 'width the spacing assumes each stroke inks over: lower packs strokes tighter and darker, raise it to open them out' },
  { g: 'output', key: 'widthMm', label: 'page width', min: 50, max: 1000, step: 10, def: 200,
    help: 'width of the drawing in mm; only the export and the on-screen stroke weight depend on it' },
  { g: 'output', key: 'maxPx', label: 'working size', min: 200, max: 1400, step: 50, def: NARROW ? 300 : 700,
    help: 'longest edge of the working image in px: larger means finer detail and a slower recompute' },
];
const GROUPS = ['tone', 'flow', 'marks', 'output'];

// engrave.py's own argparse defaults; the cli readout prints only what differs
const PY_DEF = {
  contrast: 1.15, gamma: 1.0, whitePoint: 0, flowBlur: 4, flatAngle: 25, cohFloor: 0.35,
  spacing: 3.2, minSpacing: 0.8, maxCoverage: 0.82, maxSteps: 14, step: 1.1,
  lenGamma: 1.3, dotBelow: 0.22, minTone: 0.06, dotSize: 0.35,
  crossAbove: 1.0, crossAngle: 55, penMm: 0.3, packMm: 0, widthMm: 200, maxPx: 900, seed: 0,
};
const FLAG = {
  widthMm: '--width', maxPx: '--max-px', contrast: '--contrast', gamma: '--gamma',
  whitePoint: '--white-point', flowBlur: '--flow-blur', flatAngle: '--flat-angle',
  cohFloor: '--coh-floor', spacing: '--spacing', minSpacing: '--min-spacing',
  maxCoverage: '--max-coverage', maxSteps: '--max-steps', step: '--step',
  lenGamma: '--len-gamma', dotBelow: '--dot-below', minTone: '--min-tone',
  dotSize: '--dot-size', crossAbove: '--cross-above', crossAngle: '--cross-angle',
  penMm: '--stroke', packMm: '--pack-width', seed: '--seed',
};
const ALWAYS = ['widthMm', 'maxPx'];

const params = {};

let sourceImg = null;     // Image element of the original
let imgName = 'image';    // without extension, for download filenames
let imgFile = 'image.jpg';// as loaded, for the cli readout
let worker = null;
let workerUrl = '';
let objUrl = '';        // blob url of the loaded file, revoked on the next load
let debounceTimer = null;
let computing = false;
let t0 = 0;
let splitPos = 0.3;       // fraction on the left showing the tone or flow map
let dispW = 0, dispH = 0;
let lastPack = null;      // { coords: Float32Array, offsets: Uint32Array, n }
let lastLines = null;     // lazily decoded polylines, only needed for masking
let lastDims = null;      // { w, h } of the working image
let toneImg = null, flowImg = null;
let leftView = 'tone';
let statsText = '';
let keptCount = 0;
let dlSvg = '';

function setStatus(t) { $('status').textContent = t; }

// ---- controls ----

// popover landed in safari 17 / chrome 114 / firefox 125. older browsers throw on
// showPopover, and matches(':popover-open') throws SyntaxError on an unknown
// pseudo-class, so both are routed through these two helpers.
const HAS_POPOVER = typeof HTMLElement !== 'undefined' &&
  typeof HTMLElement.prototype.showPopover === 'function';

function popOpen(pop) { return HAS_POPOVER && pop.matches(':popover-open'); }

function attachHelp(el, title, text) {
  if (!HAS_POPOVER) return;      // no bubble, but the ? stays harmless
  el.addEventListener('mouseenter', () => {
    const pop = $('helpPop');
    if (popOpen(pop)) pop.hidePopover();
    $('helpTitle').textContent = title;
    $('helpText').textContent = text;
    pop.showPopover();
    // place it left of the icon, vertically centred on it
    const r = el.getBoundingClientRect();
    const pr = pop.getBoundingClientRect();
    pop.style.left = Math.max(8, r.left - pr.width - 8) + 'px';
    pop.style.top = Math.max(8, Math.min(innerHeight - pr.height - 8, r.top + r.height / 2 - pr.height / 2)) + 'px';
  });
  el.addEventListener('mouseleave', () => {
    const pop = $('helpPop');
    if (popOpen(pop)) pop.hidePopover();
  });
}

function onParam(key) {
  updateCli();
  // draw width only changes how thick the line is painted, so it never recomputes
  if (key === 'penMm') { queueRender(); return; }
  // page width rescales the packing width into pixels, so it moves strokes too;
  // redraw at once for immediate feedback, then recompute after the debounce
  if (key === 'widthMm') queueRender();
  scheduleCompute();
}

function buildControls() {
  const host = $('controls');
  for (const g of GROUPS) {
    if (g !== GROUPS[0]) host.appendChild(document.createElement('hr'));
    const cap = document.createElement('div');
    cap.className = 'cap';
    cap.textContent = g;
    host.appendChild(cap);
    for (const c of CONTROLS.filter(x => x.g === g)) {
      params[c.key] = c.def;
      const div = document.createElement('div');
      div.className = 'ctrl';
      if (c.type === 'toggle') {
        div.innerHTML = '<label><span>' + c.label + '<span class="help">?</span></span></label>' +
          '<button id="tg-' + c.key + '">off</button>';
        const b = div.querySelector('button');
        b.addEventListener('click', () => {
          params[c.key] = !params[c.key];
          b.classList.toggle('active', params[c.key]);
          b.textContent = params[c.key] ? 'on' : 'off';
          onParam(c.key);
        });
      } else if (c.type === 'seed') {
        div.innerHTML = '<label><span>' + c.label + '<span class="help">?</span></span>' +
          '<span class="val" id="val-' + c.key + '">0</span></label>' +
          '<button id="btnSeed">reshuffle</button>';
        div.querySelector('button').addEventListener('click', () => {
          params.seed = (params.seed + 1 + Math.floor(Math.random() * 9999)) % 1000000;
          $('val-seed').textContent = String(params.seed);
          onParam('seed');
        });
      } else {
        div.innerHTML = '<label><span>' + c.label + '<span class="help">?</span></span>' +
          '<span class="val" id="val-' + c.key + '"></span></label>' +
          '<input type="range" id="sl-' + c.key + '" min="' + c.min + '" max="' + c.max +
          '" step="' + c.step + '" value="' + c.def + '">';
        const input = div.querySelector('input');
        const val = div.querySelector('.val');
        val.textContent = String(+input.value);
        input.addEventListener('input', () => {
          params[c.key] = +input.value;
          val.textContent = String(+input.value);
          onParam(c.key);
        });
      }
      attachHelp(div.querySelector('.help'), c.label, c.help);
      host.appendChild(div);
    }
  }
}
buildControls();

attachHelp($('helpLeft'), 'left of divider',
  'what the divider reveals: the darkness map the strokes are drawn from, or a smear of noise along the flow field');
attachHelp($('helpCli'), 'command',
  'the engrave.py invocation matching these settings; only flags that differ from its defaults are printed');

// set a slider without recomputing (used by the angle drag and by reset)
function setControl(key, v) {
  params[key] = v;
  const input = $('sl-' + key);
  if (input) { input.value = v; }
  const val = $('val-' + key);
  if (val) val.textContent = String(+v);
}

$('btnReset').addEventListener('click', () => {
  for (const c of CONTROLS) {
    if (c.type === 'toggle') {
      params[c.key] = c.def;
      const b = $('tg-' + c.key);
      b.classList.toggle('active', !!c.def);
      b.textContent = c.def ? 'on' : 'off';
    } else {
      setControl(c.key, c.def);
    }
  }
  updateCli();
  compute();
});

// ---- image loading ----

// fit the image to the stage, keeping the aspect ratio
function fitView() {
  if (!sourceImg) return;
  const stage = $('stage');
  const s = Math.min(
    (stage.clientWidth - 32) / sourceImg.naturalWidth,
    (stage.clientHeight - 32) / sourceImg.naturalHeight
  );
  dispW = Math.max(16, Math.round(sourceImg.naturalWidth * s));
  dispH = Math.max(16, Math.round(sourceImg.naturalHeight * s));
  $('maskSvg').setAttribute('viewBox', '0 0 ' + dispW + ' ' + dispH);
  $('angleSvg').setAttribute('viewBox', '0 0 ' + dispW + ' ' + dispH);
  renderMask();
  renderResult();
}
window.addEventListener('resize', fitView);

function loadImage(src, name) {
  const img = new Image();
  img.onload = () => {
    sourceImg = img;
    if (objUrl && objUrl !== src) URL.revokeObjectURL(objUrl);
    objUrl = src.slice(0, 5) === 'blob:' ? src : '';
    imgFile = name;
    imgName = name.replace(/\.[^.]+$/, '');
    $('imginfo').textContent = name + ' · ' + img.naturalWidth + '×' + img.naturalHeight + 'px';
    lastPack = null; lastLines = null; toneImg = null; flowImg = null;
    $('orig').classList.remove('ready');
    statsText = '';
    updateCli();
    fitView();
    compute();
  };
  img.onerror = () => setStatus('image could not be loaded');
  img.src = src;
}

$('btnLoad').addEventListener('click', () => $('fileInput').click());
$('fileInput').addEventListener('change', () => {
  const f = $('fileInput').files[0];
  if (f) loadImage(URL.createObjectURL(f), f.name);
});
$('btnExample').addEventListener('click', () => loadImage(DEMO, 'migrant-mother-1936.jpg'));

document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => {
  e.preventDefault();
  const f = e.dataTransfer.files[0];
  if (f && f.type.startsWith('image/')) loadImage(URL.createObjectURL(f), f.name);
});

function setPanel(hidden) {
  $('panel').classList.toggle('hidden', hidden);
  $('ptoggle').classList.toggle('hidden', hidden);
  $('ptoggle').innerHTML = hidden ? '&lsaquo;' : '&rsaquo;';
  $('stage').classList.toggle('wide', hidden);
  setTimeout(fitView, 220);   // refit once the slide transition has finished
}

$('ptoggle').addEventListener('click', () => setPanel(!$('panel').classList.contains('hidden')));

// below 720px the panel covers the whole viewport, so start collapsed and show the drawing
if (NARROW) setPanel(true);

// ---- hatch angle drag ----

// remember whether the help popover was open at pointerdown: the click that
// closes it must not start an angle drag
let helpWasOpen = false;
document.addEventListener('pointerdown', () => {
  helpWasOpen = popOpen($('helpPop'));
}, true);

function drawAngleGuide(deg, px, py) {
  const a = deg * Math.PI / 180, c = Math.cos(a), s = Math.sin(a);
  const L = Math.hypot(dispW, dispH), gap = Math.max(14, dispH / 14);
  let el = '';
  for (let k = -7; k <= 7; k++) {
    const cx = px - s * k * gap, cy = py + c * k * gap;   // step along the normal
    el += '<line class="' + (k ? 'g' : 'g0') + '" x1="' + (cx - c * L).toFixed(1) + '" y1="' + (cy - s * L).toFixed(1) +
      '" x2="' + (cx + c * L).toFixed(1) + '" y2="' + (cy + s * L).toFixed(1) + '"/>';
  }
  $('angleSvg').innerHTML = el;
}

$('wrapper').addEventListener('pointerdown', e => {
  if (!sourceImg || helpWasOpen || maskEdit) return;
  if (e.target.closest('#divider') || (e.target.dataset && e.target.dataset.role)) return;
  const wr = $('wrapper');
  const r = $('view').getBoundingClientRect();
  const ox = e.clientX, oy = e.clientY;
  let moved = false;
  wr.setPointerCapture(e.pointerId);
  const onMove = ev => {
    const dx = ev.clientX - ox, dy = ev.clientY - oy;
    if (!moved && Math.abs(dx) + Math.abs(dy) < 5) return;
    moved = true;
    // line field, so the angle only ever means something in 0..180
    let deg = Math.atan2(dy, dx) * 180 / Math.PI;
    deg = ((deg % 180) + 180) % 180;
    deg = Math.round(deg);
    setControl('flatAngle', deg);
    drawAngleGuide(deg, (ox - r.left) / r.width * dispW, (oy - r.top) / r.height * dispH);
    $('dragHint').textContent = 'hatch angle ' + deg + '°';
  };
  const onUp = () => {
    wr.removeEventListener('pointermove', onMove);
    wr.removeEventListener('pointerup', onUp);
    $('angleSvg').innerHTML = '';
    $('dragHint').innerHTML = DRAG_HINT;
    if (moved) { updateCli(); compute(); }
  };
  wr.addEventListener('pointermove', onMove);
  wr.addEventListener('pointerup', onUp);
});

// ---- compute ----

function scheduleCompute() {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(compute, 300);
}

function compute() {
  if (!sourceImg) return;
  clearTimeout(debounceTimer);
  if (worker) { worker.terminate(); URL.revokeObjectURL(workerUrl); }
  const blob = new Blob([$('sharedSrc').textContent, $('workerSrc').textContent], { type: 'text/javascript' });
  workerUrl = URL.createObjectURL(blob);
  worker = new Worker(workerUrl);

  // downscale exactly like load_tone(): longest edge to maxPx, truncating
  const iw = sourceImg.naturalWidth, ih = sourceImg.naturalHeight;
  const s = Math.min(1, params.maxPx / Math.max(iw, ih));
  const w = s < 1 ? Math.max(2, Math.floor(iw * s)) : Math.max(2, iw);
  const h = s < 1 ? Math.max(2, Math.floor(ih * s)) : Math.max(2, ih);

  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d', { willReadFrequently: true });
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(sourceImg, 0, 0, w, h);
  const data = ctx.getImageData(0, 0, w, h).data;
  const gray = new Float32Array(w * h);
  // pil's convert("L") weights, so the tone map matches the cli
  for (let i = 0; i < w * h; i++) {
    gray[i] = (0.299 * data[i * 4] + 0.587 * data[i * 4 + 1] + 0.114 * data[i * 4 + 2]) / 255;
  }

  const wantFlow = leftView === 'flow';
  const P = {
    contrast: params.contrast, gamma: params.gamma, invert: !!params.invert,
    whitePoint: params.whitePoint,
    flowBlur: params.flowBlur, flatAngle: params.flatAngle, cohFloor: params.cohFloor,
    spacing: params.spacing, minSpacing: params.minSpacing, maxCoverage: params.maxCoverage,
    maxSteps: params.maxSteps, step: params.step, lenGamma: params.lenGamma,
    dotBelow: params.dotBelow, minTone: params.minTone, dotSize: params.dotSize,
    crossAbove: params.crossAbove, crossAngle: params.crossAngle,
    penMm: params.penMm, packMm: params.packMm, widthMm: params.widthMm, maxPx: params.maxPx,
    seed: params.seed, maxSeeds: MAX_SEEDS,
  };

  computing = true;
  t0 = Date.now();
  setStatus('computing …');
  worker.onerror = () => { computing = false; setStatus('compute failed'); };
  worker.onmessage = e => {
    const d = e.data;
    if (d.type === 'progress') {
      setStatus(d.stage + ' … ' + Math.round(d.p * 100) + '%');
    } else if (d.type === 'done') {
      computing = false;
      lastDims = { w: d.w, h: d.h };
      lastPack = {
        coords: new Float32Array(d.coords),
        offsets: new Uint32Array(d.offsets),
        n: d.nStrokes,
      };
      lastLines = null;
      toneImg = d.tone ? new Float32Array(d.tone) : null;
      flowImg = d.flow ? new Float32Array(d.flow) : null;
      const st = d.stats || {};
      const secs = ((Date.now() - t0) / 1000).toFixed(1);
      statsText = fmt(d.nStrokes) + (d.nStrokes === 1 ? ' stroke · ' : ' strokes · ') +
        fmt(d.nDots) + (d.nDots === 1 ? ' dot · ' : ' dots · ') +
        (st.nCross ? fmt(st.nCross) + ' cross · ' : '') + secs + ' s';
      if (st.truncated) statsText += ' · truncated at ' + fmt(MAX_SEEDS) + ' seeds, raise spacing';
      drawLeft();
      renderResult();
      updateStatus();
      updateDxfEstimate();
    }
  };
  worker.postMessage({ gray: gray.buffer, w: w, h: h, params: P, wantFlow: wantFlow }, [gray.buffer]);
}

// ---- rendering ----

function maskActive() {
  return !!mask && !(mask.type === 'lasso' && (mask.drawing || mask.points.length < 3));
}

// packed strokes -> [[x,y],…] polylines; only the mask clipper needs this form
function decodeLines() {
  if (lastLines || !lastPack) return lastLines;
  const co = lastPack.coords, of = lastPack.offsets, n = lastPack.n;
  const out = new Array(n);
  for (let i = 0; i < n; i++) {
    const a = of[i], b = of[i + 1];
    const L = new Array(b - a);
    for (let j = a; j < b; j++) L[j - a] = [co[j * 2], co[j * 2 + 1]];
    out[i] = L;
  }
  lastLines = out;
  return out;
}

function penPx() {
  return params.penMm / (params.widthMm / (lastDims ? lastDims.w : 1));
}

// read a colour from the :root block, so the palette at the top of the file is
// the only place colours live. the declaration object is live, so edits to the
// stylesheet show up on the next repaint without re-querying.
let cssCache = null;
function cssVar(name, fallback) {
  if (!cssCache) cssCache = getComputedStyle(document.documentElement);
  return cssCache.getPropertyValue(name).trim() || fallback;
}

function renderResult() {
  const cv = $('view');
  if (!dispW) return;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(dispW * dpr);
  cv.height = Math.round(dispH * dpr);
  cv.style.width = dispW + 'px';
  cv.style.height = dispH + 'px';
  cv.classList.add('ready');
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = cssVar('--draw-paper', '#fffcf3');
  ctx.fillRect(0, 0, dispW, dispH);
  if (!lastPack || !lastDims) return;
  ctx.scale(dispW / lastDims.w, dispH / lastDims.h);
  ctx.strokeStyle = cssVar('--draw-ink', 'rgba(37,0,87,0.95)');
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.lineWidth = Math.max(penPx(), 0.5 * lastDims.w / dispW);   // never thinner than half a screen px
  // one batched path for the whole drawing: 200k strokes stroke in a single call
  ctx.beginPath();
  if (maskActive()) {
    const lines = clipLines(decodeLines(), lastDims.w, lastDims.h);
    keptCount = lines.length;
    for (const L of lines) {
      ctx.moveTo(L[0][0], L[0][1]);
      for (let i = 1; i < L.length; i++) ctx.lineTo(L[i][0], L[i][1]);
    }
  } else {
    const co = lastPack.coords, of = lastPack.offsets, n = lastPack.n;
    keptCount = n;
    for (let i = 0; i < n; i++) {
      const a = of[i], b = of[i + 1];
      ctx.moveTo(co[a * 2], co[a * 2 + 1]);
      for (let j = a + 1; j < b; j++) ctx.lineTo(co[j * 2], co[j * 2 + 1]);
    }
  }
  ctx.stroke();
}

// redraws coalesced to one animation frame
let renderQueued = false;
function queueRender() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => {
    renderQueued = false;
    renderResult();
    updateStatus();
  });
}

function updateStatus() {
  if (computing || !statsText) return;
  setStatus(statsText + (maskActive() ? ' · ' + fmt(keptCount) + ' after mask' : ''));
}

// tone map or lic image on the left canvas, greyscale
function drawLeft() {
  const arr = leftView === 'flow' ? flowImg : toneImg;
  if (!arr || !lastDims) { $('orig').classList.remove('ready'); return; }
  const w = lastDims.w, h = lastDims.h;
  const cv = $('orig');
  cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');
  const id = ctx.createImageData(w, h);
  const dark = leftView !== 'flow';   // tone is darkness, so show it inverted
  for (let i = 0; i < w * h; i++) {
    const v = clamp(arr[i], 0, 1);
    const g = 255 * (dark ? 1 - v : v);
    id.data[i * 4] = g;
    id.data[i * 4 + 1] = g;
    id.data[i * 4 + 2] = g;
    id.data[i * 4 + 3] = 255;
  }
  ctx.putImageData(id, 0, 0);
  cv.classList.add('ready');
}

// ---- alpha mask: a shape clips the strokes ----

let mask = null;         // {type:'ellipse'|'rect', cx,cy,rx,ry,rot} or {type:'lasso', points, drawing}; normalised 0..1
let maskInvert = false;
let maskEdit = false;    // left panel open = mask editable

function maskPx(w, h) {
  if (mask.type === 'lasso') return { type: 'lasso', pts: mask.points.map(p => [p[0] * w, p[1] * h]) };
  return { type: mask.type, cx: mask.cx * w, cy: mask.cy * h, rx: mask.rx * w, ry: mask.ry * h, rot: mask.rot };
}

function insideMask(m, x, y) {
  let inside;
  if (m.type === 'lasso') {
    inside = false;
    const p = m.pts;
    for (let i = 0, j = p.length - 1; i < p.length; j = i++) {
      if ((p[i][1] > y) !== (p[j][1] > y) &&
          x < (p[j][0] - p[i][0]) * (y - p[i][1]) / (p[j][1] - p[i][1]) + p[i][0]) inside = !inside;
    }
  } else {
    const c = Math.cos(-m.rot), sn = Math.sin(-m.rot);
    const dx = x - m.cx, dy = y - m.cy;
    const lx = dx * c - dy * sn, ly = dx * sn + dy * c;
    inside = m.type === 'ellipse'
      ? (lx * lx) / (m.rx * m.rx) + (ly * ly) / (m.ry * m.ry) <= 1
      : Math.abs(lx) <= m.rx && Math.abs(ly) <= m.ry;
  }
  return maskInvert ? !inside : inside;
}

// cut polylines geometrically, crossing point by bisection
function clipLines(lines, w, h) {
  if (!maskActive()) return lines;
  const m = maskPx(w, h);
  const out = [];
  for (const line of lines) {
    let prev = line[0], prevIn = insideMask(m, prev[0], prev[1]);
    let run = prevIn ? [prev] : null;
    for (let i = 1; i < line.length; i++) {
      const p = line[i], pin = insideMask(m, p[0], p[1]);
      if (pin !== prevIn) {
        let a = prev, b = p;
        for (let k = 0; k < 12; k++) {
          const mid = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
          if (insideMask(m, mid[0], mid[1]) === prevIn) a = mid; else b = mid;
        }
        const cut = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
        if (pin) run = [cut, p];
        else { run.push(cut); if (run.length >= 2) out.push(run); run = null; }
      } else if (pin) run.push(p);
      prev = p; prevIn = pin;
    }
    if (run && run.length >= 2) out.push(run);
  }
  return out;
}

function renderMask() {
  const svg = $('maskSvg');
  if (!mask || !maskEdit || !dispW) { svg.innerHTML = ''; return; }
  const m = maskPx(dispW, dispH);
  let el = '';
  if (m.type === 'lasso') {
    const ptsStr = m.pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
    el += mask.drawing
      ? '<polyline class="mline" points="' + ptsStr + '"/>'
      : '<polygon class="mshape" data-role="body" points="' + ptsStr + '"/>';
    el += m.pts.map((p, i) =>
      '<circle class="mhandle" data-role="vertex" data-i="' + i + '" cx="' + p[0] + '" cy="' + p[1] + '" r="5"/>').join('');
  } else {
    const deg = (m.rot * 180 / Math.PI).toFixed(2);
    const tf = 'transform="rotate(' + deg + ' ' + m.cx + ' ' + m.cy + ')"';
    el += m.type === 'ellipse'
      ? '<ellipse class="mshape" data-role="body" cx="' + m.cx + '" cy="' + m.cy + '" rx="' + m.rx + '" ry="' + m.ry + '" ' + tf + '/>'
      : '<rect class="mshape" data-role="body" x="' + (m.cx - m.rx) + '" y="' + (m.cy - m.ry) + '" width="' + (2 * m.rx) + '" height="' + (2 * m.ry) + '" ' + tf + '/>';
    el += '<line class="mline" x1="' + m.cx + '" y1="' + (m.cy - m.ry) + '" x2="' + m.cx + '" y2="' + (m.cy - m.ry - 24) + '" ' + tf + '/>';
    el += [['rx', m.cx + m.rx, m.cy], ['ry', m.cx, m.cy + m.ry], ['rot', m.cx, m.cy - m.ry - 24]]
      .map(a => '<circle class="mhandle" data-role="' + a[0] + '" cx="' + a[1] + '" cy="' + a[2] + '" r="6" ' + tf + '/>').join('');
  }
  svg.innerHTML = el;
}

// lasso points are placed by clicking the image while the mask panel is open
$('wrapper').addEventListener('click', e => {
  if (!sourceImg || helpWasOpen || !maskEdit || e.target.closest('#divider')) return;
  if (!mask || mask.type !== 'lasso' || !mask.drawing) return;
  const r = $('view').getBoundingClientRect();
  const nx = (e.clientX - r.left) / r.width, ny = (e.clientY - r.top) / r.height;
  const first = mask.points[0];
  if (mask.points.length >= 3 && first &&
      Math.hypot((nx - first[0]) * r.width, (ny - first[1]) * r.height) < 12) {
    mask.drawing = false;
  } else {
    mask.points.push([nx, ny]);
  }
  updateMaskButtons();
  renderMask();
  queueRender();
});

$('maskSvg').addEventListener('pointerdown', e => {
  const role = e.target.dataset && e.target.dataset.role;
  if (!role || !mask || !maskEdit) return;
  e.preventDefault();
  e.stopPropagation();
  // while drawing, a click on the first point closes the lasso (handled by the wrapper click)
  if (mask.type === 'lasso' && mask.drawing) return;
  const svg = $('maskSvg');
  svg.setPointerCapture(e.pointerId);
  const rect = $('view').getBoundingClientRect();
  const toNorm = ev => [(ev.clientX - rect.left) / rect.width, (ev.clientY - rect.top) / rect.height];
  let last = toNorm(e);
  const vi = role === 'vertex' ? +e.target.dataset.i : -1;
  const onMove = ev => {
    const p = toNorm(ev);
    const dx = p[0] - last[0], dy = p[1] - last[1];
    if (role === 'body') {
      if (mask.type === 'lasso') mask.points = mask.points.map(q => [q[0] + dx, q[1] + dy]);
      else { mask.cx += dx; mask.cy += dy; }
    } else if (role === 'vertex') {
      mask.points[vi] = p;
    } else if (role === 'rot') {
      mask.rot = Math.atan2((p[1] - mask.cy) * rect.height, (p[0] - mask.cx) * rect.width) + Math.PI / 2;
    } else {
      // rx/ry: pointer offset from the centre projected onto the rotated axis
      const px = (p[0] - mask.cx) * rect.width, py = (p[1] - mask.cy) * rect.height;
      const c = Math.cos(-mask.rot), sn = Math.sin(-mask.rot);
      const lx = px * c - py * sn, ly = px * sn + py * c;
      if (role === 'rx') mask.rx = Math.max(0.02, Math.abs(lx) / rect.width);
      else mask.ry = Math.max(0.02, Math.abs(ly) / rect.height);
    }
    last = p;
    renderMask();
    queueRender();
  };
  const onUp = () => {
    svg.removeEventListener('pointermove', onMove);
    svg.removeEventListener('pointerup', onUp);
  };
  svg.addEventListener('pointermove', onMove);
  svg.addEventListener('pointerup', onUp);
});

function setMask(m) { mask = m; updateMaskButtons(); renderMask(); queueRender(); }

// ---- cli readout ----

const numStr = v => String(+(+v).toFixed(4));

function buildCli() {
  const q = s => /^[\w.\-\/]+$/.test(s) ? s : "'" + s.replace(/'/g, "'\\''") + "'";
  const parts = ['./engrave.py', q(imgFile), '-o', 'out.svg'];
  for (const k of ALWAYS) parts.push(FLAG[k], numStr(params[k]));
  for (const k of Object.keys(FLAG)) {
    if (ALWAYS.indexOf(k) >= 0) continue;
    // the cross angle only means anything while cross-hatching is switched on
    if (k === 'crossAngle' && params.crossAbove >= 1) continue;
    // --pack-width 0 follows --stroke, so it is only worth printing once they differ
    if (k === 'packMm') {
      if (Math.abs(params.packMm - params.penMm) > 1e-9) parts.push(FLAG[k], numStr(params.packMm));
      continue;
    }
    if (Math.abs(params[k] - PY_DEF[k]) > 1e-9) parts.push(FLAG[k], numStr(params[k]));
  }
  if (params.invert) parts.push('--invert');
  return parts.join(' ');
}

// ---- svg export ----

// every stroke as an array of [x,y] in working pixels, mask applied. the svg
// export walks the packed buffer directly; dxf needs real arrays to simplify.
function strokeList() {
  if (maskActive()) return clipLines(decodeLines(), lastDims.w, lastDims.h);
  const co = lastPack.coords, of = lastPack.offsets, n = lastPack.n, out = [];
  for (let i = 0; i < n; i++) {
    const a = of[i], b = of[i + 1], L = [];
    for (let j = a; j < b; j++) L.push([co[j * 2], co[j * 2 + 1]]);
    out.push(L);
  }
  return out;
}

// douglas-peucker, iterative; a port of plotprep_uv.py's rdp() so the web export
// and the cli tool thin identically. eps is in the same units as the points.
function rdp(pts, eps) {
  const n = pts.length;
  if (n < 3 || eps <= 0) return pts;
  const keep = new Uint8Array(n);
  keep[0] = keep[n - 1] = 1;
  const stack = [[0, n - 1]];
  while (stack.length) {
    const seg = stack.pop(), i0 = seg[0], i1 = seg[1];
    if (i1 <= i0 + 1) continue;
    const ax = pts[i0][0], ay = pts[i0][1];
    const sx = pts[i1][0] - ax, sy = pts[i1][1] - ay;
    const L = Math.hypot(sx, sy);
    let best = -1, bi = -1;
    for (let i = i0 + 1; i < i1; i++) {
      const dx = pts[i][0] - ax, dy = pts[i][1] - ay;
      const d = L === 0 ? Math.hypot(dx, dy) : Math.abs(sx * dy - sy * dx) / L;
      if (d > best) { best = d; bi = i; }
    }
    if (best > eps) { keep[bi] = 1; stack.push([i0, bi], [bi, i1]); }
  }
  const out = [];
  for (let i = 0; i < n; i++) if (keep[i]) out.push(pts[i]);
  return out;
}

// where the drawing lands on the page, in mm, shared by the svg and dxf exports
function outputGeom() {
  const w = lastDims.w, h = lastDims.h, paper = $('paperSel').value;
  if (paper) {
    let pw = +paper.split(',')[0], ph = +paper.split(',')[1];
    if ((w > h) !== (pw > ph)) { const t = pw; pw = ph; ph = t; }
    const margin = 10;
    const sc = Math.min((pw - 2 * margin) / w, (ph - 2 * margin) / h);
    return { sc: sc, ox: (pw - w * sc) / 2, oy: (ph - h * sc) / 2, pageW: pw, pageH: ph };
  }
  const sc = params.widthMm / w;
  return { sc: sc, ox: 0, oy: 0, pageW: w * sc, pageH: h * sc };
}

function strokePaths() {
  const f = v => v.toFixed(2);
  const out = [];
  if (maskActive()) {
    for (const L of clipLines(decodeLines(), lastDims.w, lastDims.h)) {
      out.push('<path d="M' + L.map(p => f(p[0]) + ',' + f(p[1])).join('L') + '"/>');
    }
  } else {
    const co = lastPack.coords, of = lastPack.offsets, n = lastPack.n;
    for (let i = 0; i < n; i++) {
      const a = of[i], b = of[i + 1];
      let d = 'M' + f(co[a * 2]) + ',' + f(co[a * 2 + 1]);
      for (let j = a + 1; j < b; j++) d += 'L' + f(co[j * 2]) + ',' + f(co[j * 2 + 1]);
      out.push('<path d="' + d + '"/>');
    }
  }
  return out.join('\n');
}

function buildDlSvg() {
  const w = lastDims.w, h = lastDims.h;
  const paths = strokePaths();
  const paper = $('paperSel').value;
  if (paper) {
    // page in mm, image fitted with a 10 mm margin, orientation follows the image
    let pw = +paper.split(',')[0], ph = +paper.split(',')[1];
    if ((w > h) !== (pw > ph)) { const t = pw; pw = ph; ph = t; }
    const margin = 10;
    const sc = Math.min((pw - 2 * margin) / w, (ph - 2 * margin) / h);   // mm per px
    const ox = (pw - w * sc) / 2, oy = (ph - h * sc) / 2;
    const sw = (params.penMm / sc).toFixed(4);   // real pen width once the group scale is applied
    dlSvg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + pw + ' ' + ph +
      '" width="' + pw + 'mm" height="' + ph + 'mm">\n' +
      '<g transform="translate(' + ox.toFixed(3) + ' ' + oy.toFixed(3) + ') scale(' + sc.toFixed(6) +
      ')" fill="none" stroke="#000" stroke-width="' + sw + '" stroke-linejoin="round" stroke-linecap="round">\n' +
      paths + '\n</g>\n</svg>';
  } else {
    // coordinates stay in working pixels, but width/height are given in mm so the
    // file has a real physical size. without a unit, everything downstream reads
    // the viewBox at 96 dpi and the drawing comes out 26% small.
    const sw = penPx().toFixed(4);
    const pwmm = (w * (params.widthMm / w)).toFixed(2), phmm = (h * (params.widthMm / w)).toFixed(2);
    dlSvg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + w + ' ' + h +
      '" width="' + pwmm + 'mm" height="' + phmm + 'mm">\n' +
      '<g fill="none" stroke="#000" stroke-width="' + sw + '" stroke-linejoin="round" stroke-linecap="round">\n' +
      paths + '\n</g>\n</svg>';
  }
  return dlSvg;
}

// ---- dxf export ----

// DXF R12 is what Silhouette Studio imports most reliably: its importer drops
// SPLINE entities and is happiest with plain POLYLINE/VERTEX, which is also what
// plotprep_uv.py emits. Coordinates are mm, and y is flipped because dxf y points
// up while image y points down. No handles - R12 only needs them if $HANDLING is on.
const DXF_TOL = 0.05;            // mm, plotprep_uv.py's default simplification

// Studio slows to a crawl on tens of thousands of entities, and thinning points
// barely helps: strokes average about three points with a floor of two, so the
// per-entity overhead dominates. The only real lever is fewer marks, so these
// presets say so plainly rather than pretending a tolerance tweak fixes it.
const DXF_PRESETS = {
  '':       { tol: 0.05, dec: 3, cap: 0 },
  light:    { tol: 0.20, dec: 2, cap: 20000 },
  medium:   { tol: 0.20, dec: 2, cap: 10000 },
  heavy:    { tol: 0.25, dec: 2, cap: 5000 },
};

function dxfPair(code, value) { return code + '\n' + value + '\n'; }

// the geometry a dxf export would contain, without building the text
function dxfGeometry() {
  const P = DXF_PRESETS[$('dxfSel').value] || DXF_PRESETS[''];
  const g = outputGeom();
  let lines = strokeList();
  const total = lines.length;
  // seeds come out of dart throwing in random spatial order, so an even stride is
  // an unbiased spatial sample: the drawing keeps its tonal balance, just lighter
  if (P.cap && total > P.cap) {
    const step = total / P.cap, kept = [];
    for (let i = 0; i < P.cap; i++) kept.push(lines[Math.floor(i * step)]);
    lines = kept;
  }
  const polys = [];
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity, pts = 0;
  for (const L of lines) {
    const mm = L.map(p => [g.ox + p[0] * g.sc, g.pageH - (g.oy + p[1] * g.sc)]);
    const s = rdp(mm, P.tol);
    if (s.length < 2) continue;
    for (const p of s) {
      if (p[0] < minX) minX = p[0];
      if (p[0] > maxX) maxX = p[0];
      if (p[1] < minY) minY = p[1];
      if (p[1] > maxY) maxY = p[1];
    }
    polys.push(s);
    pts += s.length;
  }
  return { polys: polys, pts: pts, total: total, dec: P.dec, g: g,
           minX: minX, minY: minY, maxX: maxX, maxY: maxY };
}

function buildDxf() {
  const geo = dxfGeometry();
  const polys = geo.polys, pts = geo.pts, g = geo.g;
  const minX = geo.minX, minY = geo.minY, maxX = geo.maxX, maxY = geo.maxY;
  if (!polys.length) return null;

  const n = v => v.toFixed(geo.dec);
  let s = '';
  s += dxfPair(0, 'SECTION') + dxfPair(2, 'HEADER');
  s += dxfPair(9, '$ACADVER') + dxfPair(1, 'AC1009');
  s += dxfPair(9, '$INSUNITS') + dxfPair(70, 4);          // 4 = millimetres
  s += dxfPair(9, '$EXTMIN') + dxfPair(10, n(minX)) + dxfPair(20, n(minY)) + dxfPair(30, '0.0');
  s += dxfPair(9, '$EXTMAX') + dxfPair(10, n(maxX)) + dxfPair(20, n(maxY)) + dxfPair(30, '0.0');
  s += dxfPair(9, '$LIMMIN') + dxfPair(10, '0.0') + dxfPair(20, '0.0');
  s += dxfPair(9, '$LIMMAX') + dxfPair(10, n(g.pageW)) + dxfPair(20, n(g.pageH));
  s += dxfPair(0, 'ENDSEC');

  // a minimal but complete table section: importers expect layer 0 to be declared
  s += dxfPair(0, 'SECTION') + dxfPair(2, 'TABLES');
  s += dxfPair(0, 'TABLE') + dxfPair(2, 'LTYPE') + dxfPair(70, 1);
  s += dxfPair(0, 'LTYPE') + dxfPair(2, 'CONTINUOUS') + dxfPair(70, 0) +
       dxfPair(3, 'Solid line') + dxfPair(72, 65) + dxfPair(73, 0) + dxfPair(40, '0.0');
  s += dxfPair(0, 'ENDTAB');
  s += dxfPair(0, 'TABLE') + dxfPair(2, 'LAYER') + dxfPair(70, 1);
  s += dxfPair(0, 'LAYER') + dxfPair(2, '0') + dxfPair(70, 0) +
       dxfPair(62, 7) + dxfPair(6, 'CONTINUOUS');
  s += dxfPair(0, 'ENDTAB') + dxfPair(0, 'ENDSEC');

  s += dxfPair(0, 'SECTION') + dxfPair(2, 'ENTITIES');
  for (const p of polys) {
    s += dxfPair(0, 'POLYLINE') + dxfPair(8, '0') + dxfPair(66, 1) +
         dxfPair(10, '0.0') + dxfPair(20, '0.0') + dxfPair(30, '0.0') + dxfPair(70, 0);
    for (const v of p) {
      s += dxfPair(0, 'VERTEX') + dxfPair(8, '0') +
           dxfPair(10, n(v[0])) + dxfPair(20, n(v[1])) + dxfPair(30, '0.0');
    }
    s += dxfPair(0, 'SEQEND') + dxfPair(8, '0');
  }
  s += dxfPair(0, 'ENDSEC') + dxfPair(0, 'EOF');
  lastDxfStats = { polys: polys.length, pts: pts, total: geo.total, bytes: s.length };
  return s;
}

let lastDxfStats = null;

// show the trade before the download, not after
function updateDxfEstimate() {
  const el = $('dxfEst');
  if (!lastPack || !lastDims) { el.textContent = ''; return; }
  const geo = dxfGeometry();
  // entity overhead plus per-vertex text; matches the written file to a few percent
  const mb = (geo.polys.length * 40 + geo.pts * (40 + 2 * geo.dec)) / 1e6;
  const dropped = geo.total - geo.polys.length;
  el.textContent = 'r12 polylines in mm, y up · ' + fmt(geo.polys.length) + ' marks, ' +
    fmt(geo.pts) + ' points, about ' + mb.toFixed(1) + ' MB' +
    (dropped > 0 ? ' · drops ' + fmt(dropped) + ' of ' + fmt(geo.total) +
      ' marks, so the plot comes out lighter than the preview' : '');
}

$('dxfSel').addEventListener('change', updateDxfEstimate);

attachHelp($('helpSimp'), 'simplify for studio',
  'silhouette studio bogs down on tens of thousands of entities. thinning points barely ' +
  'helps — strokes are only about three points each — so the only real lever is drawing ' +
  'fewer marks. these presets drop marks evenly across the image, which keeps the tonal ' +
  'balance but makes the whole plot lighter. it only affects the dxf, not the svg or the preview.');

$('paperSel').addEventListener('change', () => { updateStatus(); updateDxfEstimate(); });

$('btnDlSvg').addEventListener('click', () => {
  if (!lastPack || !lastDims) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([buildDlSvg()], { type: 'image/svg+xml' }));
  const opt = $('paperSel').selectedOptions[0];
  const suffix = opt.value ? '-' + opt.dataset.slug + (lastDims.w > lastDims.h ? '-landscape' : '-portrait') : '';
  a.download = imgName + '-engraved' + suffix + '.svg';
  a.click();
  URL.revokeObjectURL(a.href);
});

$('btnDlDxf').addEventListener('click', () => {
  if (!lastPack || !lastDims) return;
  const text = buildDxf();
  if (!text) { setStatus('nothing to export'); return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'image/vnd.dxf' }));
  const opt = $('paperSel').selectedOptions[0];
  const suffix = opt.value ? '-' + opt.dataset.slug + (lastDims.w > lastDims.h ? '-landscape' : '-portrait') : '';
  a.download = imgName + '-engraved' + suffix + '.dxf';
  a.click();
  URL.revokeObjectURL(a.href);
  const st = lastDxfStats;
  setStatus(fmt(st.polys) + ' of ' + fmt(st.total) + ' marks · ' + fmt(st.pts) +
    ' points · ' + (st.bytes / 1e6).toFixed(1) + ' MB dxf');
});


// demo embedded as a data uri so the page also runs from file://
loadImage(DEMO, 'migrant-mother-1936.jpg');
</script>
</body>
</html>
